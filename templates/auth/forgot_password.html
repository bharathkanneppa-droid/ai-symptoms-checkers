{% extends "auth_base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="auth-heading-wrap">
    <h2 class="auth-heading">Reset password</h2>
    <p class="auth-sub">Enter your email and we'll send a reset link (in dev it's printed to the server console).</p>
</div>

<form method="post" action="{{ url_for('auth.forgot_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-4">
        <label class="form-label">Email address</label>
        <div class="input-group auth-input">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
        </div>
    </div>
    <button type="submit" class="btn btn-auth w-100">Send reset link <i class="bi bi-send"></i></button>
</form>

<div class="text-center mt-3">
    <a href="{{ url_for('auth.login') }}"><i class="bi bi-arrow-left"></i> Back to login</a>
</div>
{% endblock %}
