{% extends "auth_base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-heading-wrap">
    <h2 class="auth-heading">Choose a new password</h2>
    <p class="auth-sub">Pick a strong password you haven't used before</p>
</div>

<form method="post" action="{{ url_for('auth.reset_password', token=token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label class="form-label">New password</label>
        <div class="input-group auth-input">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="Min 8 characters" required autofocus>
        </div>
    </div>
    <div class="mb-4">
        <label class="form-label">Confirm new password</label>
        <div class="input-group auth-input">
            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
            <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
        </div>
    </div>
    <button type="submit" class="btn btn-auth w-100">Update password <i class="bi bi-check2-circle"></i></button>
</form>

<div class="text-center mt-3">
    <a href="{{ url_for('auth.login') }}"><i class="bi bi-arrow-left"></i> Back to login</a>
</div>
{% endblock %}
