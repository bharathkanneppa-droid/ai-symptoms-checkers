services:
  - type: web
    name: medassist-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DB
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: medassist-db
          property: connectionString

databases:
  - name: medassist-db
    plan: starter
    ipAllowList: []
