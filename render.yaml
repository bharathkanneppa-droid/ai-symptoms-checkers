web:
  name: medassist-ai
  plan: free
  runtime: python
  buildCommand: pip install -r requirements.txt
  startCommand: gunicorn wsgi:app
  envVars:
    - key: SECRET_KEY
      generateValue: true
    - key: DATABASE_URL
      fromDatabase:
        name: medassist-db
        property: connectionString
  disk:
    name: data
    mountPath: /opt/render/project/src
    sizeGB: 1

databases:
  - name: medassist-db
    plan: free
